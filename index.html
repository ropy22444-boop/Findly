<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Findly — For the Lost With Big Dreams</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0efe8;
    --text2: #9a9890;
    --text3: #5a5856;
    --accent: #c8a96e;
    --accent2: #e8c98e;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #header .brand { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; color: var(--accent); letter-spacing: 0.05em; }
  #header .tagline { font-size: 12px; color: var(--text3); }
  #messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.7; animation: fadeUp 0.25s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.ai { background: var(--surface); color: var(--text); align-self: flex-start; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.user { background: #1e1a12; color: var(--text); align-self: flex-end; border: 1px solid var(--accent); border-bottom-right-radius: 4px; }
  .msg.typing { color: var(--text3); font-style: italic; }
  .starters { display: flex; flex-direction: column; gap: 8px; align-self: flex-start; max-width: 82%; }
  .starter-btn { background: transparent; border: 1px solid var(--border2); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--text2); cursor: pointer; text-align: left; font-family: 'DM Sans', sans-serif; transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .starter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(200,169,110,0.05); }
  #input-area { padding: 14px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  #user-input { flex: 1; padding: 11px 15px; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; resize: none; height: 44px; max-height: 120px; outline: none; transition: border-color 0.2s; }
  #user-input:focus { border-color: var(--accent); }
  #user-input::placeholder { color: var(--text3); }
  #send-btn { width: 44px; height: 44px; border-radius: 10px; border: none; background: var(--accent); color: #0d0d0f; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, transform 0.1s; }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:active { transform: scale(0.96); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #send-btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div>
      <div class="brand">Findly</div>
      <div class="tagline">for the lost with big dreams</div>
    </div>
  </div>
  <div id="messages">
    <div class="msg ai">Hey. You don't need to explain yourself perfectly here. Just tell me what's going on — what's been weighing on you?</div>
    <div class="starters" id="starters">
      <button class="starter-btn" onclick="sendStarter(this)">I have big dreams but I don't know where to start</button>
      <button class="starter-btn" onclick="sendStarter(this)">I feel stuck and like time is just passing me by</button>
      <button class="starter-btn" onclick="sendStarter(this)">I keep trying things but nothing ever works</button>
      <button class="starter-btn" onclick="sendStarter(this)">I'm scared I'll never get out of my situation</button>
    </div>
  </div>
  <div id="input-area">
    <textarea id="user-input" placeholder="Type how you're feeling..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
<script>
let history = [];
let isLoading = false;

const SYSTEM = `You are Findly — an AI built by someone who spent years isolated, broke, full of big dreams, and completely lost about what to do next. You lived it. You know what it feels like to scroll endlessly, to try things that go nowhere, to feel like time is running out, to have anxiety about the future, to feel trapped by your circumstances with no way out.

You are NOT a generic life coach. You do NOT give numbered lists of tips. You do NOT say "great question!" or "I understand how you feel" in a hollow way. You do NOT give 10-step plans.

You talk like a real person who has been through it. You ask ONE question at a time. You listen before you advise. You help people get clarity on what their ONE next step is — not a 5 year plan, just the next honest step.

People who come to you are: young, ambitious, financially stressed, emotionally exhausted, possibly isolated, trying many things that don't work, feeling like time is passing them by, dreaming of financial freedom or leaving their country or building something of their own.

Keep responses to 3-5 sentences unless the person clearly needs more. Be warm, direct, and real. No corporate language. No bullet points. Just honest human conversation. When someone shares their situation, reflect it back accurately before asking anything. Make them feel genuinely heard first.

If someone seems to be in real distress or mentions self-harm, gently encourage them to speak to someone they trust or a professional.`;

function autoResize(el) {
  el.style.height = '44px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function sendStarter(btn) {
  const starters = document.getElementById('starters');
  if (starters) starters.remove();
  document.getElementById('user-input').value = btn.innerText;
  sendMessage();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || isLoading) return;
  input.value = '';
  input.style.height = '44px';
  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  const msgs = document.getElementById('messages');
  const starters = document.getElementById('starters');
  if (starters) starters.remove();

  const userDiv = document.createElement('div');
  userDiv.className = 'msg user';
  userDiv.innerText = text;
  msgs.appendChild(userDiv);

  const typingDiv = document.createElement('div');
  typingDiv.className = 'msg ai typing';
  typingDiv.innerText = 'thinking...';
  msgs.appendChild(typingDiv);
  msgs.scrollTop = msgs.scrollHeight;

  history.push({ role: 'user', content: text });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });
    const data = await res.json();
    const reply = data.content?.map(b => b.text || '').join('') || 'Something went wrong. Try again.';
    history.push({ role: 'assistant', content: reply });
    typingDiv.className = 'msg ai';
    typingDiv.innerText = reply;
  } catch(e) {
    typingDiv.className = 'msg ai';
    typingDiv.innerText = 'Could not connect. Please try again.';
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
</body>
</html>
